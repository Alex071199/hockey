version: "3.8"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./hockey.db"
      ONHOCKEY_BASE_URL: "https://www.onhockey.tv/"
    volumes:
      - ./backend:/app
      - db-data:/app/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
