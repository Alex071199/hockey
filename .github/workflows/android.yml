name: Android TV APK

on:
  push:
    paths:
      - "android-tv/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HockeyLiveTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HockeyLiveTV-apk
          path: android-tv/app/build/outputs/apk/debug/HockeyLiveTV.apk

      - name: Release APK (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/app/build/outputs/apk/debug/HockeyLiveTV.apk
